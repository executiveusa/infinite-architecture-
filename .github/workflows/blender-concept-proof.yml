name: Blender concept proof

on:
  push:
    branches:
      - feature/private-concept-studio-v1
    paths:
      - "workers/blender/**"
      - ".github/workflows/blender-concept-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-concept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLENDER_VERSION: "4.5.14"
      BLENDER_RELEASE: "Blender4.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Blender LTS
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          base="https://download.blender.org/release/${BLENDER_RELEASE}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/blender-${BLENDER_VERSION}.sha256"
          grep " ${archive}$" "blender-${BLENDER_VERSION}.sha256" | sha256sum -c -
          tar -xf "${archive}"
          echo "$PWD/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"
          "$PWD/blender-${BLENDER_VERSION}-linux-x64/blender" --version

      - name: Check worker Python syntax
        run: python3 -m py_compile workers/blender/server.py

      - name: Render bounded demo concept
        run: |
          mkdir -p artifacts/blender-proof
          blender --background --factory-startup --python-exit-code 1 --python workers/blender/generate_concept.py -- workers/blender/job.example.json artifacts/blender-proof

      - name: Verify expected artifacts
        run: |
          test -s artifacts/blender-proof/concept.blend
          test -s artifacts/blender-proof/concept.glb
          test -s artifacts/blender-proof/hero.png
          test -s artifacts/blender-proof/manifest.json
          cat artifacts/blender-proof/manifest.json
          sha256sum artifacts/blender-proof/* > artifacts/blender-proof/SHA256SUMS.txt

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinite-architecture-blender-proof
          path: artifacts/blender-proof
          if-no-files-found: error
          retention-days: 7
